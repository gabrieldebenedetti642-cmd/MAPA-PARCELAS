<style>
  :root{
    --bg-dark:#1C2620;
    --bg-dark-t:rgba(23,31,26,0.92);
    --bg-card:#233028;
    --text-light:#F5F3EE;
    --text-muted:#AEBAB2;
    --border:rgba(245,243,238,0.12);
    --campo:#4A90D9;
    --parcela:#E8871E;
    --linea:#E23D3D;
    --danger:#E05555;
    --radius:12px;
    --radius-sm:8px;
  }
  body.theme-light{
    --bg-dark:#EFEDE6;
    --bg-dark-t:rgba(239,237,230,0.92);
    --bg-card:#FFFFFF;
    --text-light:#20281F;
    --text-muted:#5C6960;
    --border:rgba(28,38,32,0.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  svg{flex-shrink:0;}
  .icon-btn svg{width:20px;height:20px;flex-shrink:0;}
  .fab-locate svg, .close-x svg, .row-actions svg{width:18px;height:18px;flex-shrink:0;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body.theme-light #map{background:#cfd9d0;}
  body{
    display:flex;flex-direction:column;height:100vh;height:100dvh;height:calc(var(--app-height, 100vh));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg-dark);color:var(--text-light);
    overflow:hidden;
  }
  button{font-family:inherit;}
  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
    background:var(--bg-dark-t);border-bottom:1px solid var(--border);
    position:relative;z-index:500;
  }
  header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:0.2px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .logo{width:26px;height:26px;flex-shrink:0;}
  .header-actions{display:flex;gap:6px;align-items:center;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:none;
    background:rgba(245,243,238,0.08);color:var(--text-light);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .icon-btn:active{background:rgba(245,243,238,0.18);}
  .badge{
    position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 3px;
    background:var(--parcela);color:#1C2620;font-size:10px;font-weight:700;
    border-radius:8px;display:flex;align-items:center;justify-content:center;
  }
  /* ---------- Map area ---------- */
  #mapWrap{flex:1 1 auto;min-height:0;position:relative;}
  #map{position:absolute;inset:0;background:#0d1310;}

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'mapaParcelas_v1';
  var TYPE_INFO = {
    campo:   { label:'Campo',   color:'#4A90D9', isPolygon:true,  minPoints:3 },
    parcela: { label:'Parcela', color:'#E8871E', isPolygon:true,  minPoints:3 },
    linea:   { label:'Línea',   color:'#E23D3D', isPolygon:false, minPoints:2 }
  };

  var shapes = [];          // saved shapes {id,type,name,points,areaHa}
  var layerById = {};       // id -> leaflet layer
  var map, drawnLayerGroup;
  var mode = null;
  var editingId = null;     // id of the shape being edited, null when drawing a new one
  var drawPoints = [];      // array of L.LatLng
  var tempMarkers = [];
  var tempPreviewLayer = null;
  var pendingArea = null;
  var pendingStatus = null;
  var originalStatus = null;
  var lastDeleted = null;
  var undoTimeoutId = null;
  var youMarker = null;
  var gpsWatchId = null;
  var gpsLiveMarker = null;
  var lastGpsPoint = null;
  var gpsFollowMode = true;
  var GPS_MIN_DISTANCE = 6;   // meters between auto-added points
  var GPS_MAX_ACCURACY = 25;  // ignore GPS readings worse than this many meters

  // ---------- persistence ----------
  function loadShapes(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveShapes(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(shapes)); }catch(e){}
  }

  // ---------- geometry ----------
  function computeAreaHa(latlngs){
    if(latlngs.length < 3) return 0;
    var R = 6378137;
    var latAvg = latlngs.reduce(function(s,p){return s+p.lat;},0) / latlngs.length * Math.PI/180;
    var pts = latlngs.map(function(p){
      return {
        x: R * (p.lng * Math.PI/180) * Math.cos(latAvg),
        y: R * (p.lat * Math.PI/180)
      };
    });
    var area = 0;
    for(var i=0;i<pts.length;i++){
      var j=(i+1)%pts.length;
      area += pts[i].x*pts[j].y - pts[j].x*pts[i].y;
    }
    return Math.abs(area)/2/10000;
  }

  function fmtHa(n){
    return n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ha';
  }

  // ---------- map setup ----------
  function initMap(){
    map = L.map('map', { attributionControl:false, zoomControl:false, rotate:true, touchRotate:true, rotateControl:false });
    L.control.zoom({position:'topright'}).addTo(map);
    L.control.attribution({position:'bottomleft', prefix:false})
      .addAttribution('Imágenes © Esri, Maxar, Earthstar Geographics')
      .addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 20,
      maxNativeZoom: 19
    }).addTo(map);

    drawnLayerGroup = L.layerGroup().addTo(map);
    map.setView([-34.6, -63.5], 6);

    map.on('click', onMapClick);

    // try silent initial geolocation
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(function(pos){
        map.setView([pos.coords.latitude, pos.coords.longitude], 15);
      }, function(){ /* silent fail on load */ }, { timeout:6000 });
    }
  }

  function vertexIcon(color){
    return L.divIcon({ className:'', html:'<div class="vertex-dot" style="--type-color:'+color+'"></div>', iconSize:[18,18] });
  }

  function statusEmoji(status){
    if(status === 'ocupado') return '🐄 ';
    if(status === 'descansando') return '🌱 ';
    return '';
  }

  function renderShapeOnMap(shape){
    var info = TYPE_INFO[shape.type];
    var latlngs = shape.points.map(function(p){ return L.latLng(p[0], p[1]); });
    var layer;
    if(info.isPolygon){
      layer = L.polygon(latlngs, { color: info.color, weight:2, fillColor: info.color, fillOpacity:0.18 });
    } else {
      layer = L.polyline(latlngs, { color: info.color, weight:4 });
    }
    layer.bindTooltip(statusEmoji(shape.status) + shape.name, { permanent:true, direction:'center', className:'shape-label' });
    layer.addTo(drawnLayerGroup);
    layerById[shape.id] = layer;
  }

  function redrawAll(){
    drawnLayerGroup.clearLayers();
    layerById = {};
    shapes.forEach(renderShapeOnMap);
    updateListBadge();
  }

  // ---------- drawing flow ----------
  function startDrawing(type){
    mode = type;
    editingId = null;
    drawPoints = [];
    clearTempLayers();
    setupDrawingUI(type, TYPE_INFO[type].label);
    updateDrawUI();
  }

  function setupDrawingUI(type, title){
    var info = TYPE_INFO[type];
    document.getElementById('toolbarDefault').style.display = 'none';
    var dt = document.getElementById('toolbarDrawing');
    dt.classList.add('show');
    dt.style.setProperty('--type-color', info.color);
    var finishBtn = document.getElementById('finishDrawBtn');
    finishBtn.style.setProperty('--type-color', info.color);
    var toast = document.getElementById('drawToast');
    toast.style.setProperty('--type-color', info.color);
    toast.classList.add('show');
    document.getElementById('drawToastTitle').textContent = title;
    var gpsBtn = document.getElementById('gpsToggleBtn');
    gpsBtn.classList.remove('active');
    gpsBtn.classList.add('show');
    gpsBtn.style.setProperty('--type-color', info.color);
    updateGpsHint();
  }

  function startEditShape(id){
    var shape = shapes.filter(function(s){ return s.id === id; })[0];
    if(!shape) return;
    closeListModal();
    var oldLayer = layerById[id];
    if(oldLayer) drawnLayerGroup.removeLayer(oldLayer);
    editingId = id;
    mode = shape.type;
    drawPoints = [];
    clearTempLayers();
    setupDrawingUI(shape.type, 'Editando ' + TYPE_INFO[shape.type].label);
    shape.points.forEach(function(p){
      var latlng = L.latLng(p[0], p[1]);
      drawPoints.push(latlng);
      createVertexMarker(latlng);
    });
    updatePreview();
    updateDrawUI();
    map.flyToBounds(L.latLngBounds(drawPoints), { padding:[60,60], maxZoom:17 });
  }

  function updateGpsHint(){
    var hint = document.getElementById('drawToastHint');
    if(gpsWatchId !== null){
      hint.textContent = ': caminá el límite, se agregan puntos solos · también podés tocar el mapa';
    } else {
      hint.textContent = ': tocá el mapa para agregar vértices · arrastrá un punto para moverlo · tocalo para borrarlo';
    }
  }

  function computeLengthM(latlngs){
    var total = 0;
    for(var i=0;i<latlngs.length-1;i++){
      total += latlngs[i].distanceTo(latlngs[i+1]);
    }
    return total;
  }

  function formatLength(meters){
    if(meters < 1000) return Math.round(meters) + ' m';
    return (meters/1000).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' km';
  }

  function updateDrawUI(){
    var info = TYPE_INFO[mode];
    var n = drawPoints.length;
    var measure = '';
    if(info.isPolygon){
      if(n >= 3) measure = fmtHa(computeAreaHa(drawPoints));
    } else if(n >= 2){
      measure = formatLength(computeLengthM(drawPoints));
    }
    document.getElementById('drawToastCount').textContent =
      n + (n===1 ? ' punto' : ' puntos') + (n < info.minPoints ? ' (mínimo ' + info.minPoints + ')' : '') +
      (measure ? ' · ' + measure : '');
    document.getElementById('finishDrawBtn').disabled = n < info.minPoints;
  }

  function onMapClick(e){
    if(!mode) return;
    addVertex(e.latlng);
  }

  function addVertex(latlng){
    drawPoints.push(latlng);
    createVertexMarker(latlng);
    updatePreview();
    updateDrawUI();
  }

  function createVertexMarker(latlng){
    var marker = L.marker(latlng, { icon: vertexIcon(TYPE_INFO[mode].color), draggable:true, autoPan:true });
    marker.on('drag', function(){
      var idx = tempMarkers.indexOf(marker);
      if(idx === -1) return;
      drawPoints[idx] = marker.getLatLng();
      updatePreview();
      updateDrawUI();
    });
    marker.on('click', function(ev){
      L.DomEvent.stopPropagation(ev);
      deleteVertex(marker);
    });
    marker.addTo(map);
    tempMarkers.push(marker);
    return marker;
  }

  function deleteVertex(marker){
    var idx = tempMarkers.indexOf(marker);
    if(idx === -1) return;
    map.removeLayer(marker);
    tempMarkers.splice(idx,1);
    drawPoints.splice(idx,1);
    updatePreview();
    updateDrawUI();
  }

  function updatePreview(){
    if(tempPreviewLayer){ map.removeLayer(tempPreviewLayer); tempPreviewLayer = null; }
    if(drawPoints.length < 2) return;
    var color = TYPE_INFO[mode].color;
    var group = L.layerGroup();
    if(TYPE_INFO[mode].isPolygon && drawPoints.length >= 3){
      L.polygon(drawPoints, { color:'#fff', weight:7, opacity:1, fill:false }).addTo(group);
      L.polygon(drawPoints, { color:color, weight:4, fillColor:color, fillOpacity:0.2 }).addTo(group);
    } else {
      L.polyline(drawPoints, { color:'#fff', weight:7, opacity:1 }).addTo(group);
      L.polyline(drawPoints, { color:color, weight:4 }).addTo(group);
    }
    group.addTo(map);
    tempPreviewLayer = group;
  }

  function clearTempLayers(){
    tempMarkers.forEach(function(m){ map.removeLayer(m); });
    tempMarkers = [];
    if(tempPreviewLayer){ map.removeLayer(tempPreviewLayer); tempPreviewLayer = null; }
  }

  function undoLastPoint(){
    if(!tempMarkers.length) return;
    deleteVertex(tempMarkers[tempMarkers.length-1]);
  }

  function cancelDrawing(){
    stopGpsTracking();
    clearTempLayers();
    if(editingId){
      var shape = shapes.filter(function(s){ return s.id === editingId; })[0];
      if(shape) renderShapeOnMap(shape);
      editingId = null;
    }
    drawPoints = [];
    mode = null;
    document.getElementById('toolbarDefault').style.display = 'flex';
    document.getElementById('toolbarDrawing').classList.remove('show');
    document.getElementById('drawToast').classList.remove('show');
    document.getElementById('gpsToggleBtn').classList.remove('show');
  }

  // ---------- GPS tracking mode ----------
  function toggleGps(){
    if(gpsWatchId !== null) stopGpsTracking();
    else startGpsTracking();
  }

  function startGpsTracking(){
    if(!mode) return;
    if(!navigator.geolocation){
      alert('Este dispositivo no puede usar GPS.');
      return;
    }
    document.getElementById('gpsToggleBtn').classList.add('active');
    lastGpsPoint = drawPoints.length ? drawPoints[drawPoints.length-1] : null;
    gpsFollowMode = true;
    map.on('dragstart', onUserMapDrag);
    gpsWatchId = navigator.geolocation.watchPosition(onGpsPosition, onGpsError, {
      enableHighAccuracy:true, maximumAge:1000, timeout:15000
    });
    updateGpsHint();
  }

  function onUserMapDrag(){
    gpsFollowMode = false;
  }

  function stopGpsTracking(){
    if(gpsWatchId !== null){
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
    }
    map.off('dragstart', onUserMapDrag);
    document.getElementById('gpsToggleBtn').classList.remove('active');
    if(gpsLiveMarker){ map.removeLayer(gpsLiveMarker); gpsLiveMarker = null; }
    updateGpsHint();
  }

  function onGpsPosition(pos){
    var latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
    if(!gpsLiveMarker){
      gpsLiveMarker = L.marker(latlng, { icon: L.divIcon({className:'', html:'<div class="gps-live-marker"></div>', iconSize:[16,16]}), interactive:false }).addTo(map);
    } else {
      gpsLiveMarker.setLatLng(latlng);
    }
    if(gpsFollowMode) map.panTo(latlng, { animate:true });

    if(pos.coords.accuracy && pos.coords.accuracy > GPS_MAX_ACCURACY) return;

    if(!lastGpsPoint || latlng.distanceTo(lastGpsPoint) >= GPS_MIN_DISTANCE){
      addVertex(latlng);
      lastGpsPoint = latlng;
    }
  }

  function onGpsError(err){
    stopGpsTracking();
    if(err && err.code === 1){
      alert('No se pudo activar el GPS: falta el permiso de ubicación. Revisá los permisos de la página en el navegador.');
    } else {
      alert('Se perdió la señal de GPS. Revisá que esté activado y que tengas buena señal.');
    }
  }

  function suggestName(type){
    var count = shapes.filter(function(s){ return s.type===type; }).length;
    return TYPE_INFO[type].label + ' ' + (count+1);
  }

  function finishDrawing(){
    var info = TYPE_INFO[mode];
    if(drawPoints.length < info.minPoints) return;
    pendingArea = info.isPolygon ? computeAreaHa(drawPoints) : null;
    var input = document.getElementById('nameInput');
    var existing = editingId ? shapes.filter(function(s){ return s.id === editingId; })[0] : null;
    if(editingId){
      document.getElementById('nameModalTitle').textContent = 'Editar ' + info.label;
      input.value = existing ? existing.name : suggestName(mode);
    } else {
      document.getElementById('nameModalTitle').textContent = 'Nueva ' + info.label;
      input.value = suggestName(mode);
    }
    document.getElementById('notesInput').value = existing && existing.notes ? existing.notes : '';
    pendingStatus = existing && existing.status ? existing.status : null;
    originalStatus = pendingStatus;
    var statusField = document.getElementById('statusField');
    if(info.isPolygon){
      statusField.style.display = 'block';
      updateStatusButtonsUI(info.color);
    } else {
      statusField.style.display = 'none';
    }
    var areaLine = document.getElementById('areaLine');
    if(pendingArea !== null){
      areaLine.style.display = 'flex';
      document.getElementById('areaValue').textContent = fmtHa(pendingArea);
    } else {
      areaLine.style.display = 'none';
    }
    document.getElementById('nameSaveBtn').style.setProperty('--type-color', info.color);
    document.getElementById('nameBackdrop').classList.add('show');
    setTimeout(function(){ input.focus(); input.select(); }, 80);
  }

  function updateStatusButtonsUI(color){
    ['statusOcupadoBtn','statusDescansandoBtn'].forEach(function(id){
      var btn = document.getElementById(id);
      var isSel = btn.dataset.status === pendingStatus;
      btn.classList.toggle('selected', isSel);
      btn.style.setProperty('--type-color', color);
    });
  }

  function toggleStatus(value){
    pendingStatus = (pendingStatus === value) ? null : value;
    updateStatusButtonsUI(TYPE_INFO[mode].color);
  }

  function confirmSaveShape(){
    var name = document.getElementById('nameInput').value.trim() || suggestName(mode);
    var notes = document.getElementById('notesInput').value.trim();
    var points = drawPoints.map(function(ll){ return [ll.lat, ll.lng]; });
    var statusDate = null;
    if(pendingStatus){
      statusDate = (editingId && originalStatus === pendingStatus) ?
        (shapes.filter(function(s){ return s.id === editingId; })[0] || {}).statusDate || new Date().toISOString() :
        new Date().toISOString();
    }
    if(editingId){
      var idx = shapes.findIndex(function(s){ return s.id === editingId; });
      if(idx !== -1){
        shapes[idx].name = name;
        shapes[idx].points = points;
        shapes[idx].areaHa = pendingArea;
        shapes[idx].notes = notes;
        shapes[idx].status = pendingStatus;
        shapes[idx].statusDate = statusDate;
        renderShapeOnMap(shapes[idx]);
      }
      editingId = null;
    } else {
      var shape = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        type: mode,
        name: name,
        points: points,
        areaHa: pendingArea,
        notes: notes,
        status: pendingStatus,
        statusDate: statusDate
      };
      shapes.push(shape);
      renderShapeOnMap(shape);
    }
    saveShapes();
    updateListBadge();
    document.getElementById('nameBackdrop').classList.remove('show');
    cancelDrawing();
  }

  // ---------- list modal ----------
  function updateListBadge(){
    var badge = document.getElementById('listBadge');
    if(shapes.length){
      badge.style.display = 'flex';
      badge.textContent = shapes.length;
    } else {
      badge.style.display = 'none';
    }
  }

  function openListModal(){
    document.getElementById('searchInput').value = '';
    renderListContent();
    document.getElementById('listBackdrop').classList.add('show');
  }
  function closeListModal(){
    document.getElementById('listBackdrop').classList.remove('show');
  }

  function renderListContent(){
    var scroll = document.getElementById('listScroll');
    var summary = document.getElementById('summaryLine');
    var rawQuery = document.getElementById('searchInput').value.trim();
    var query = rawQuery.toLowerCase();
    scroll.innerHTML = '';

    if(!shapes.length){
      summary.textContent = 'Todavía no hay nada marcado.';
      scroll.innerHTML = '<div class="empty-state">Tocá <b>Campo</b>, <b>Parcela</b> o <b>Línea</b> abajo para empezar a marcar en el mapa.</div>';
      return;
    }

    var visible = query ? shapes.filter(function(s){ return s.name.toLowerCase().indexOf(query) !== -1; }) : shapes;

    if(query){
      summary.textContent = visible.length + ' resultado' + (visible.length!==1?'s':'') + ' para "' + rawQuery + '"';
    } else {
      var counts = { campo:0, parcela:0, linea:0 };
      var parcelaHaTotal = 0;
      shapes.forEach(function(s){
        counts[s.type]++;
        if(s.type==='parcela' && s.areaHa) parcelaHaTotal += s.areaHa;
      });
      summary.textContent = counts.campo + ' campo' + (counts.campo!==1?'s':'') +
        ' · ' + counts.parcela + ' parcela' + (counts.parcela!==1?'s':'') +
        (counts.parcela ? ' (' + fmtHa(parcelaHaTotal) + ')' : '') +
        ' · ' + counts.linea + ' línea' + (counts.linea!==1?'s':'');
    }

    if(query && !visible.length){
      scroll.innerHTML = '<div class="empty-state">No se encontró ningún elemento con ese nombre.</div>';
      return;
    }

    ['campo','parcela','linea'].forEach(function(type){
      var group = visible.filter(function(s){ return s.type===type; });
      if(!group.length) return;
      var titleEl = document.createElement('div');
      titleEl.className = 'group-title';
      titleEl.textContent = TYPE_INFO[type].label + 's';
      scroll.appendChild(titleEl);
      group.forEach(function(s){
        scroll.appendChild(buildRow(s));
      });
    });
  }

  function buildRow(s){
    var info = TYPE_INFO[s.type];
    var row = document.createElement('div');
    row.className = 'row-item';
    var areaText = s.areaHa!=null ? fmtHa(s.areaHa) : '—';
    var statusText = '';
    if(s.status){
      var label = s.status === 'ocupado' ? 'Ocupado' : 'Descansando';
      var dateText = s.statusDate ? ' desde ' + new Date(s.statusDate).toLocaleDateString('es-AR') : '';
      statusText = ' · ' + statusEmoji(s.status) + label + dateText;
    }
    row.innerHTML =
      '<div class="dot" style="background:'+info.color+'"></div>' +
      '<div class="info"><div class="name"></div><div class="area">'+areaText+statusText+'</div>' +
        (s.notes ? '<div class="notes"></div>' : '') +
      '</div>' +
      '<div class="row-actions">' +
        '<button class="go" aria-label="Ir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2V5M12 19V22M2 12H5M19 12H22"/></svg></button>' +
        '<button class="edit" aria-label="Editar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>' +
        '<button class="del" aria-label="Borrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7H20M9 7V4H15V7M6 7L7 20H17L18 7"/></svg></button>' +
      '</div>';
    row.querySelector('.name').textContent = s.name;
    if(s.notes) row.querySelector('.notes').textContent = s.notes;
    row.querySelector('.go').addEventListener('click', function(){ flyToShape(s.id); closeListModal(); });
    row.querySelector('.edit').addEventListener('click', function(){ startEditShape(s.id); });
    row.querySelector('.del').addEventListener('click', function(){ deleteShape(s.id); });
    return row;
  }

  function flyToShape(id){
    var layer = layerById[id];
    if(!layer) return;
    map.flyToBounds(layer.getBounds(), { padding:[60,60], maxZoom:17 });
  }

  function deleteShape(id){
    var idx = shapes.findIndex(function(s){ return s.id === id; });
    if(idx === -1) return;
    var shape = shapes[idx];
    var layer = layerById[id];
    if(layer) drawnLayerGroup.removeLayer(layer);
    delete layerById[id];
    shapes.splice(idx, 1);
    saveShapes();
    updateListBadge();
    renderListContent();
    showUndoToast(shape);
  }

  function showUndoToast(shape){
    lastDeleted = shape;
    document.getElementById('undoToastText').textContent = '"' + shape.name + '" borrado';
    document.getElementById('undoToast').classList.add('show');
    if(undoTimeoutId) clearTimeout(undoTimeoutId);
    undoTimeoutId = setTimeout(function(){
      document.getElementById('undoToast').classList.remove('show');
      lastDeleted = null;
    }, 6000);
  }

  function undoDelete(){
    if(!lastDeleted) return;
    shapes.push(lastDeleted);
    saveShapes();
    renderShapeOnMap(lastDeleted);
    updateListBadge();
    renderListContent();
    document.getElementById('undoToast').classList.remove('show');
    if(undoTimeoutId) clearTimeout(undoTimeoutId);
    lastDeleted = null;
  }

  // ---------- export / clear ----------
  function exportData(){
    if(!shapes.length){ alert('Todavía no hay nada para exportar.'); return; }
    var lines = ['Mapa de Parcelas — ' + new Date().toLocaleDateString('es-AR'), ''];
    ['campo','parcela','linea'].forEach(function(type){
      var group = shapes.filter(function(s){ return s.type===type; });
      if(!group.length) return;
      lines.push(TYPE_INFO[type].label + 's:');
      group.forEach(function(s){
        lines.push('- ' + s.name + (s.areaHa!=null ? ' — ' + fmtHa(s.areaHa) : ''));
      });
      lines.push('');
    });
    var parcelaHaTotal = shapes.filter(function(s){return s.type==='parcela';})
      .reduce(function(a,s){return a + (s.areaHa||0);},0);
    if(parcelaHaTotal) lines.push('Total parcelas: ' + fmtHa(parcelaHaTotal));
    var text = lines.join('\n');

    if(navigator.share){
      navigator.share({ title:'Mapa de Parcelas', text:text }).catch(function(){});
    } else {
      var blob = new Blob([text], {type:'text/plain'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mapa-parcelas.txt';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    closeMenu();
  }

  function exportBackup(){
    if(!shapes.length){ alert('Todavía no hay nada guardado para respaldar.'); return; }
    var json = JSON.stringify(shapes, null, 2);
    var blob = new Blob([json], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mapa-parcelas-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    closeMenu();
  }

  function toKmlColor(hex){
    hex = hex.replace('#','');
    return 'ff' + hex.substring(4,6) + hex.substring(2,4) + hex.substring(0,2);
  }

  function kmlEscape(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function exportKML(){
    if(!shapes.length){ alert('Todavía no hay nada para exportar.'); return; }
    var kml = '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document>\n<name>Mapa de Parcelas</name>\n';
    ['campo','parcela','linea'].forEach(function(type){
      var info = TYPE_INFO[type];
      var lineColor = toKmlColor(info.color);
      kml += '<Style id="style_'+type+'"><LineStyle><color>'+lineColor+'</color><width>3</width></LineStyle>';
      if(info.isPolygon) kml += '<PolyStyle><color>4d'+lineColor.substring(2)+'</color></PolyStyle>';
      kml += '</Style>\n';
    });
    shapes.forEach(function(s){
      var info = TYPE_INFO[s.type];
      var coords = s.points.map(function(p){ return p[1]+','+p[0]+',0'; });
      if(info.isPolygon) coords.push(coords[0]);
      var desc = [];
      if(s.areaHa != null) desc.push('Área: ' + fmtHa(s.areaHa));
      if(s.status) desc.push('Estado: ' + (s.status==='ocupado'?'Ocupado':'Descansando') + (s.statusDate ? ' desde ' + new Date(s.statusDate).toLocaleDateString('es-AR') : ''));
      if(s.notes) desc.push('Notas: ' + s.notes);
      kml += '<Placemark><name>'+kmlEscape(s.name)+'</name>';
      if(desc.length) kml += '<description>'+kmlEscape(desc.join(' | '))+'</description>';
      kml += '<styleUrl>#style_'+s.type+'</styleUrl>';
      kml += info.isPolygon ?
        '<Polygon><outerBoundaryIs><LinearRing><coordinates>'+coords.join(' ')+'</coordinates></LinearRing></outerBoundaryIs></Polygon>' :
        '<LineString><coordinates>'+coords.join(' ')+'</coordinates></LineString>';
      kml += '</Placemark>\n';
    });
    kml += '</Document></kml>';
    var blob = new Blob([kml], {type:'application/vnd.google-earth.kml+xml'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mapa-parcelas.kml';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    closeMenu();
  }

  function triggerRestore(){
    document.getElementById('importFileInput').click();
    closeMenu();
  }

  function handleRestoreFile(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var data = JSON.parse(evt.target.result);
        if(!Array.isArray(data)) throw new Error('formato inválido');
        var valid = data.every(function(s){
          return s && s.id && s.type && TYPE_INFO[s.type] && typeof s.name === 'string' && Array.isArray(s.points);
        });
        if(!valid) throw new Error('formato inválido');
        if(!confirm('Esto va a REEMPLAZAR todo lo que tenés guardado ahora por el contenido del archivo (' + data.length + ' elementos). ¿Continuar?')) return;
        shapes = data;
        saveShapes();
        redrawAll();
        alert('Backup restaurado: ' + data.length + ' elementos.');
      }catch(err){
        alert('No se pudo leer el archivo. Asegurate de que sea un backup exportado desde esta misma app.');
      }
      document.getElementById('importFileInput').value = '';
    };
    reader.readAsText(file);
  }

  function clearAllData(){
    if(!confirm('¿Seguro que querés borrar todo lo marcado? Esta acción no se puede deshacer.')) return;
    shapes = [];
    saveShapes();
    redrawAll();
    renderListContent();
    closeMenu();
  }

  // ---------- locate ----------
  function locateMe(){
    if(!navigator.geolocation){ alert('Este dispositivo no puede compartir su ubicación.'); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      var ll = [pos.coords.latitude, pos.coords.longitude];
      map.flyTo(ll, 16);
      if(youMarker) map.removeLayer(youMarker);
      youMarker = L.marker(ll, { icon: L.divIcon({className:'', html:'<div class="you-marker"></div>', iconSize:[16,16]}) }).addTo(map);
    }, function(){
      alert('No se pudo obtener tu ubicación. Revisá que el GPS y los permisos estén activados.');
    }, { enableHighAccuracy:true, timeout:8000 });
  }

  // ---------- menu ----------
  function closeMenu(){ document.getElementById('menuPop').classList.remove('show'); }

  // ---------- theme ----------
  function applyTheme(theme){
    document.body.classList.toggle('theme-light', theme === 'light');
  }
  function toggleTheme(){
    var isLight = document.body.classList.contains('theme-light');
    var next = isLight ? 'dark' : 'light';
    applyTheme(next);
    try{ localStorage.setItem('mapaParcelas_theme', next); }catch(e){}
  }

  // ---------- wire up ----------
  document.querySelectorAll('.type-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ startDrawing(btn.dataset.type); });
  });
  document.getElementById('undoBtn').addEventListener('click', undoLastPoint);
  document.getElementById('gpsToggleBtn').addEventListener('click', toggleGps);
  document.getElementById('cancelDrawBtn').addEventListener('click', cancelDrawing);
  document.getElementById('finishDrawBtn').addEventListener('click', finishDrawing);

  document.getElementById('nameCancelBtn').addEventListener('click', function(){
    document.getElementById('nameBackdrop').classList.remove('show');
  });
  document.getElementById('nameSaveBtn').addEventListener('click', confirmSaveShape);
  document.getElementById('statusOcupadoBtn').addEventListener('click', function(){ toggleStatus('ocupado'); });
  document.getElementById('statusDescansandoBtn').addEventListener('click', function(){ toggleStatus('descansando'); });
  document.getElementById('undoDeleteBtn').addEventListener('click', undoDelete);
  document.getElementById('nameInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') confirmSaveShape();
  });

  document.getElementById('listBtn').addEventListener('click', openListModal);
  document.getElementById('listCloseBtn').addEventListener('click', closeListModal);
  document.getElementById('searchInput').addEventListener('input', renderListContent);
  document.getElementById('listBackdrop').addEventListener('click', function(e){
    if(e.target === this) closeListModal();
  });

  document.getElementById('menuBtn').addEventListener('click', function(e){
    e.stopPropagation();
    document.getElementById('menuPop').classList.toggle('show');
  });
  document.addEventListener('click', function(e){
    var pop = document.getElementById('menuPop');
    if(pop.classList.contains('show') && !pop.contains(e.target) && e.target.id!=='menuBtn'){
      closeMenu();
    }
  });
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('backupBtn').addEventListener('click', exportBackup);
  document.getElementById('restoreBtn').addEventListener('click', triggerRestore);
  document.getElementById('importFileInput').addEventListener('change', handleRestoreFile);
  document.getElementById('kmlBtn').addEventListener('click', exportKML);
  document.getElementById('ndviBtn').addEventListener('click', function(){
    var c = map.getCenter();
    var z = Math.min(map.getZoom(), 16);
    var url = 'https://browser.dataspace.copernicus.eu/?zoom=' + z + '&lat=' + c.lat.toFixed(5) + '&lng=' + c.lng.toFixed(5);
    window.open(url, '_blank');
    closeMenu();
  });
  document.getElementById('clearAllBtn').addEventListener('click', clearAllData);

  document.getElementById('locateBtn').addEventListener('click', locateMe);
  document.getElementById('compassBtn').addEventListener('click', function(){
    if(map.setBearing) map.setBearing(0);
  });
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);

  // ---------- viewport height fix (iOS Safari) ----------
  function setAppHeight(){
    document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    if(typeof map !== 'undefined' && map) map.invalidateSize();
  }
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function(){ setTimeout(setAppHeight, 200); });

  // ---------- init ----------
  setAppHeight();
  var savedTheme = 'dark';
  try{ savedTheme = localStorage.getItem('mapaParcelas_theme') || 'dark'; }catch(e){}
  applyTheme(savedTheme);
  initMap();
  map.on('rotate', function(){
    if(!map.getBearing) return;
    document.getElementById('compassBtn').style.transform = 'rotate(' + (-map.getBearing()) + 'deg)';
  });
  shapes = loadShapes();
  redrawAll();
  setTimeout(setAppHeight, 300);

})();
</script>
</body>
</html>
